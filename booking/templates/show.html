{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Dashboard | TURFX</title>
        <link href="{% static 'assets/img/favicon.png' %}" rel="icon">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600">
    <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/tooplate.css' %}">
</head>

<body id="reportsPage" class="bg02">
    <div id="home">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <nav class="navbar navbar-expand-xl navbar-light bg-black">
                        <a class="navbar-brand" href="{% url 'index2' %}">
                            <i class="fas fa-3x fa-tachometer-alt tm-site-icon"></i>
                            <h1 class="tm-site-title mb-0">Dashboard</h1>
                        </a>
                        <button class="navbar-toggler ml-auto mr-0" type="button" data-toggle="collapse"
                        data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <ul class="nav mx-auto">
                                <li class="nav-item">
                                    <a class="nav-link" href="{% url 'index2' %}">Dashboard</a>
                                </li>
                                <li class="nav-item active">
                                    <a class="nav-link" href="{% url 'show' %}">Users</a>
                                    
                                </li>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="{% url 'slot' %}">Bookings</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="{% url 'accounts' %}">Accounts</a>
                                </li>
                               
                            </ul>
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a class="nav-link d-flex" href="{% url 'log' %}">
                                        <i class="far fa-user mr-2 tm-logout-icon"></i>
                                        <span>Logout</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
          
            <div class="container2">
    <h2>User Login List</h2>

    <table>
        
        <thead>
            <tr>
                <th>Email</th>
                <th>Password</th>
                <th>Confirm Password</th>
              
            </tr>
        </thead>
        <tbody>
            {% for data in emp %}
            <tr>
                <td>{{ data.email }}</td>
                <td>{{ data.password }}</td>
                <td>{{ data.conpassword }}</td>
                
            </tr>
            {% endfor %}
        </tbody>
    </table>
            </div>

            <footer class="row tm-mt-small">
                <div class="col-12 font-weight-light">
                    <p class="d-inline-block tm-bg-black text-white py-2 px-4">
                        Copyright &copy; 2025. Created by TURFX
                    </p>
                </div>
            </footer>
        </div>
    </div>

<style>
        .container2 {
            font-family: Arial, sans-serif;
    
            margin: 0;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #5e3232;
        }

        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        
        }

        caption {
            caption-side: top;
            font-size: 1.5em;
            margin: 10px 0;
            color: #2c3e50;
        }

        th, td {
            padding: 12px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            
            color: #fff;
        }

        tr:hover {
            background-color: #f1f1f116;
        }

        

        a[href*="delete"] {
            background-color: #e74c3c;
            color: white;
        }

        a[href*="update"] {
            background-color: #3498db;
            color: white;
        }

       
         ul,a{
    font-weight: 600;
    color: rgb(91, 120, 122);
   }
    </style>

    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>

</html>
