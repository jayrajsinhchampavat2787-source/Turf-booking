<div class="container2">
  <form class="edit-form2" method="post">
    {% csrf_token %}
    <h2>Edit Account</h2>

    <label for="account_name">Username</label>
    <input type="text" id="account_name" name="account_name" placeholder="turfx">

    <label for="email">Account Email</label>
    <input type="email" id="email" name="email" placeholder="turfx@gmail.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="turfx123">

    <label for="confirm_password">Re-enter Password</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="turfx123">
     
    

   <div class="form-buttons">
    <button type="submit" name="action" value="save">Save</button>
    <button type="submit" name="action" value="delete" class="delete-btn">Delete Account</button>
  </div>
  </form>
</div>

                </div>
            </div>

        </div>
<style>
    /* This should wrap the whole content area */
.container2 {
  display: flex;
  justify-content: center;   /* Horizontal center */
  align-items: center;       /* Vertical center (optional) */
  min-height: 100vh;    
       /* Full viewport height */
}

/* Optional: Style your form for better layout */
.edit-form2 {
  background-color: #1e1e1e46;
  padding: 40px 30px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 700px;
}

/* Form header */
.edit-form2 h2 {
  margin-bottom: 20px;
  text-align: center;
  color: #333;
}

/* Label styling */
.edit-form2 label {
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
  color: #444;
}

/* Input styling */
.edit-form2 input[type="text"],
.edit-form2 input[type="email"],
.edit-form2 input[type="password"],
.edit-form2 input[type="tel"] {
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 18px;
  background-color: #6464644e;
  border: 1px solid #ccc;
  border-radius: 6px;
  transition: border-color 0.3s ease;
}

.edit-form2 input:focus {
  border-color: #007bff;
  outline: none;
}

/* Button styling */
.form-buttons {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-top: 20px;
}

.form-buttons button {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.form-buttons button[type="submit"] {
  background-color: #4CAF50; /* green */
  color: white;
}

.form-buttons .delete-btn {
  background-color: #f44336; /* red */
  color: white;
}
button:hover{
    background-color: #4d9e50;
}

    .box{
        border-radius: 8px;

        background-color: rgba(255, 252, 252, 0.211);
    }
   ul,a{

   }
